database = "listings.db"

[images]
dossier = "images"       # copie locale des photos (servie par Datasette sous /images/)
max_par_passage = 1000

[filtres]
# prix_max = 1400
# tailles = ["3½", "4½"]

[scrapers.kijiji]
enabled = true
max_pages = 50     # par URL ; toutes les pages sont lues pour détecter les annonces retirées
delay = 2.0        # secondes entre deux requêtes
image_rule = "kijijica-1600-webp"  # résolution des photos en cache
max_details = 100  # pages d'annonce ouvertes max par passage (le reste au suivant)
urls = [
    # Locations long terme, Ville de Québec, plus récentes en premier
    # (pas de « k0 » : il ajouterait « ville de quebec » comme mots-clés et filtrerait presque tout)
    "https://www.kijiji.ca/b-appartement-condo/ville-de-quebec/c37l1700124?sort=dateDesc",
]

[scrapers.msi]
enabled = true
regions = ["capitale-nationale"]   # slugs du catalogue MSI
delay = 0                          # tout vient d'un seul appel API
max_details = 1000

[scrapers.logisco]
enabled = true
delay = 1.0          # entre deux pages d'unité
max_details = 150

[trajets]
otp_url = "http://localhost:8080/otp/gtfs/v1"
arrivee = "08:30"        # arrivée visée le prochain mardi (autobus : tient compte des horaires)
max_par_passage = 500    # requêtes OTP max par passage

[[trajets.destinations]]
nom = "ULaval"           # Pavillon Adrien-Pouliot
lat = 46.77866
lng = -71.27458

[[trajets.destinations]]
nom = "Travail"          # 400 Rue Nolin
lat = 46.81559
lng = -71.26786

[isochrones]
# appartment-search --isochrones : temps vers chaque destination depuis une grille de points.
bbox = [-71.55, 46.70, -71.05, 47.00]   # ouest, sud, est, nord
pas_m = 500                             # ~5 000 points par destination et par mode
modes = ["bus", "velo"]                 # "auto" possible aussi
paralleles = 4                          # requêtes OTP simultanées
