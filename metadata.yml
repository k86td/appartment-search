title: Recherche d'appartement
databases:
  listings:
    tables:
      annonces_trajets:
        sort: ulaval_bus
        facets: [source, taille, meuble, animaux, chauffage_inclus]
      annonces:
        sort_desc: premiere_vue
        facets: [source, taille, meuble, animaux, chauffage_inclus, actif]
      listings:
        sort_desc: premiere_vue
        facets: [source, taille, actif]
      attributs:
        facets: [nom, valeur]
    queries:
      carte:
        title: Annonces actives sur la carte
        sql: |-
          SELECT t.*, d.images
          FROM annonces_trajets t LEFT JOIN details d ON d.listing_id = t.id
          WHERE t.actif = 1 ORDER BY t.premiere_vue DESC
